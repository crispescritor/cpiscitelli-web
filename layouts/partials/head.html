<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="keywords" content="{{ .Site.Params.keywords }}">
<meta name="author" content="{{ .Site.Params.author }}">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0d0c0b">
<link rel="canonical" href="{{ .Permalink }}">

<!-- Hreflang -->
<link rel="alternate" hreflang="es" href="{{ .Permalink }}">
<link rel="alternate" hreflang="es-AR" href="{{ .Permalink }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ .Site.BaseURL }}img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Cristian Piscitelli — Universo Quemado">
<meta property="og:site_name" content="Cristian Piscitelli — Universo Quemado">
<meta property="og:locale" content="es_AR">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="{{ .Site.Params.twitterSite }}">
<meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="twitter:image" content="{{ .Site.BaseURL }}img/og-image.png">

<!-- Favicon — Logo CiP -->
<link rel="icon" type="image/png" href="{{ .Site.BaseURL }}img/logocp.png" sizes="any">
<link rel="apple-touch-icon" href="{{ .Site.BaseURL }}img/logocp.png">

<!-- CSS -->
{{ $css := resources.Get "css/main.css" }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">

<!-- AOS -->
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

<!-- JSON-LD: Person (todas las páginas) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Cristian Piscitelli",
  "url": "{{ .Site.BaseURL }}",
  "image": "{{ .Site.BaseURL }}img/foto-autor.png",
  "jobTitle": "Escritor",
  "description": "Escritor argentino de thriller psicológico rural. Creador del Universo Quemado.",
  "nationality": { "@type": "Country", "name": "Argentina" },
  "birthPlace": { "@type": "Place", "name": "Chacabuco, Buenos Aires, Argentina" },
  "sameAs": [
    "{{ .Site.Params.instagram }}",
    "{{ .Site.Params.amazon }}",
    "{{ .Site.Params.goodreads }}",
    "{{ .Site.Params.facebook }}",
    "{{ .Site.Params.youtube }}"
  ]
}
</script>

{{ if .IsHome }}
<!-- JSON-LD: WebSite + SearchAction -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Cristian Piscitelli — Universo Quemado",
  "url": "{{ .Site.BaseURL }}",
  "description": "{{ .Site.Params.description }}",
  "inLanguage": "es-AR",
  "author": { "@type": "Person", "name": "Cristian Piscitelli" }
}
</script>

<!-- JSON-LD: Books (homepage) -->
<script type="application/ld+json">
[
  {
    "@context": "https://schema.org",
    "@type": "Book",
    "name": "El Boliche Quemado",
    "author": { "@type": "Person", "name": "Cristian Piscitelli" },
    "isbn": "978-631-00-6801-5",
    "inLanguage": "es",
    "bookFormat": "EBook",
    "genre": ["Thriller Psicológico", "Realismo Gótico", "Literatura Argentina"],
    "description": "Un boliche incendiado, una historia que nadie quiere contar y un pueblo que parece saber más de lo que admite.",
    "publisher": { "@type": "Organization", "name": "Autopublicación" },
    "url": "{{ .Site.BaseURL }}libros/"
  },
  {
    "@context": "https://schema.org",
    "@type": "Book",
    "name": "Contexto Quemado",
    "author": { "@type": "Person", "name": "Cristian Piscitelli" },
    "isbn": "978-631-00-8019-2",
    "inLanguage": "es",
    "bookFormat": "EBook",
    "genre": ["Cuentos", "Thriller Psicológico", "Literatura Argentina"],
    "description": "Diez cuentos cortos que incineran. Diez umbrales. Diez combustiones breves.",
    "publisher": { "@type": "Organization", "name": "Autopublicación" },
    "url": "{{ .Site.BaseURL }}libros/"
  }
]
</script>
{{ end }}

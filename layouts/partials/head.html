<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ .Site.BaseURL }}img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="Cristian Piscitelli — Universo Quemado">
<meta property="og:locale" content="es_AR">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="twitter:image" content="{{ .Site.BaseURL }}img/og-image.png">

<meta name="theme-color" content="#0d0c0b">
<meta name="author" content="Cristian Piscitelli">

<!-- Favicon SVG (brasa) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='50%25' cy='70%25' r='60%25'><stop offset='0%25' stop-color='%23d97034'/><stop offset='100%25' stop-color='%23c15c1e'/></radialGradient></defs><ellipse cx='50' cy='75' rx='28' ry='18' fill='%230d0c0b'/><path d='M50 15 C38 35 28 42 32 58 C36 70 44 75 50 76 C56 75 64 70 68 58 C72 42 62 35 50 15Z' fill='url(%23g)'/><path d='M50 38 C44 48 40 54 43 63 C46 70 50 72 50 72 C50 72 54 70 57 63 C60 54 56 48 50 38Z' fill='%23faf8f3' opacity='.7'/></svg>">

<!-- CSS -->
{{ $css := resources.Get "css/main.css" }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">

<!-- AOS -->
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

{{ partial "popups.html" . }}

<footer class="footer">
  <div class="container">
    <div class="footer__logo">Cristian Piscitelli</div>
    <div class="footer__tagline">{{ .Site.Params.tagline }}</div>
    <div class="footer__redes">
      <a href="{{ .Site.Params.tienda }}">Tienda</a>
      <a href="{{ .Site.Params.instagram }}" target="_blank" rel="noopener">Instagram</a>
      <a href="{{ .Site.Params.facebook }}" target="_blank" rel="noopener">Facebook</a>
      <a href="{{ .Site.Params.tiktok }}" target="_blank" rel="noopener">TikTok</a>
      <a href="{{ .Site.Params.youtube }}" target="_blank" rel="noopener">YouTube</a>
      <a href="{{ .Site.Params.amazon }}" target="_blank" rel="noopener">Amazon</a>
      <a href="{{ .Site.Params.goodreads }}" target="_blank" rel="noopener">Goodreads</a>
      <a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a>
    </div>
    <div class="footer__copy">&copy; {{ now.Year }} Cristian Piscitelli. Todos los derechos reservados. &nbsp;·&nbsp; <a href="/privacidad/" style="color:inherit;opacity:.65;text-decoration:underline">Política de privacidad</a></div>
  </div>
</footer>

<!-- =============================================
     BIBLIOTECAS JAVASCRIPT
     ============================================= -->
<!-- Lenis (smooth scroll) -->
<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
<!-- AOS (Animate on Scroll) -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<!-- Typed.js -->
<script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>
<!-- Vanilla Tilt -->
<script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>

<script>
(function() {
  /* ------------------------------------------------
     1. PAGE LOADER
     ------------------------------------------------ */
  window.addEventListener('load', function() {
    var loader = document.getElementById('page-loader');
    if (loader) {
      setTimeout(function() { loader.classList.add('oculto'); }, 600);
    }
  });

  /* ------------------------------------------------
     2. LENIS — smooth scroll
     ------------------------------------------------ */
  if (typeof Lenis !== 'undefined') {
    var lenis = new Lenis({ duration: 1.4, easing: function(t) { return Math.min(1, 1.001 - Math.pow(2, -10 * t)); } });
    function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);
  }

  /* ------------------------------------------------
     3. AOS — animate on scroll
     ------------------------------------------------ */
  AOS.init({ duration: 700, once: true, offset: 60, easing: 'ease-out-cubic' });

  /* ------------------------------------------------
     4. TYPED.JS — tagline hero con frases del autor
     ------------------------------------------------ */
  var taglineEl = document.getElementById('typed-tagline');
  if (taglineEl && typeof Typed !== 'undefined') {
    var FRASES_CP = [
      "Escribe historias donde lo que arde no siempre se ve, pero siempre deja olor a humo.",
      "En los pueblos chicos, los secretos no mueren. Cambian de dueño.",
      "Los muertos desaparecen. Las consecuencias no.",
      "Hay silencios que no buscan paz. Buscan impunidad.",
      "La culpa tiene mejor memoria que la conciencia.",
      "Lo más peligroso de una mentira larga es que termina produciendo recuerdos verdaderos.",
      "Hay casas donde el pasado no está detrás. Está sentado a la cabecera.",
      "Hay apellidos construidos con el mismo material que las ruinas: tiempo, orgullo y silencio.",
      "La verdad rara vez destruye una familia. Lo hace todo lo que se construyó para evitarla.",
      "Algunas heridas no cicatrizan. Se vuelven costumbre.",
      "Toda familia tiene una tumba que no está en el cementerio y una flor que nadie se anima a llevar.",
      "La culpa se vuelve peligrosa cuando deja de pedir castigo y empieza a pedir herederos.",
      "Hay silencios que parecen educación hasta que alguien descubre lo que esconden.",
      "Los pueblos no absuelven ni condenan: conservan a cada persona en el lugar donde más conviene recordarla.",
      "Una familia puede sobrevivir años sin amor, pero rara vez sobrevive un día entero con la verdad sobre la mesa."
    ];
    new Typed('#typed-tagline', {
      strings: FRASES_CP,
      typeSpeed: 38,
      backSpeed: 14,
      backDelay: 4200,
      startDelay: 600,
      loop: true,
      shuffle: true,
      showCursor: true,
      cursorChar: '|'
    });
  }

  /* ------------------------------------------------
     5. VANILLA TILT — libro cards
     ------------------------------------------------ */
  if (typeof VanillaTilt !== 'undefined') {
    VanillaTilt.init(document.querySelectorAll('.libro-card'), {
      max: 6,
      speed: 600,
      glare: true,
      'max-glare': 0.12,
      perspective: 1000
    });
  }

  /* ------------------------------------------------
     6. CUSTOM CURSOR (solo desktop)
     ------------------------------------------------ */
  if (window.matchMedia('(pointer: fine)').matches) {
    var punto = document.querySelector('.cursor-punto');
    var anillo = document.querySelector('.cursor-anillo');
    if (punto && anillo) {
      var mx = 0, my = 0, ax = 0, ay = 0;
      document.addEventListener('mousemove', function(e) { mx = e.clientX; my = e.clientY; });
      (function loop() {
        ax += (mx - ax) * 0.22;
        ay += (my - ay) * 0.22;
        punto.style.left = mx + 'px';
        punto.style.top  = my + 'px';
        anillo.style.left = ax + 'px';
        anillo.style.top  = ay + 'px';
        requestAnimationFrame(loop);
      })();
      document.querySelectorAll('a, button, .libro-card').forEach(function(el) {
        el.addEventListener('mouseenter', function() {
          punto.classList.add('agrandado');
          anillo.classList.add('agrandado');
        });
        el.addEventListener('mouseleave', function() {
          punto.classList.remove('agrandado');
          anillo.classList.remove('agrandado');
        });
      });
    }
  }

  /* ------------------------------------------------
     7. HEADER SHRINK on scroll
     ------------------------------------------------ */
  var header = document.querySelector('.header');
  if (header) {
    window.addEventListener('scroll', function() {
      if (window.scrollY > 60) {
        header.style.padding = '0';
        header.style.boxShadow = '0 2px 30px rgba(0,0,0,.7)';
      } else {
        header.style.padding = '';
        header.style.boxShadow = '';
      }
    }, { passive: true });
  }

  /* ------------------------------------------------
     8. STATS COUNTER ANIMATION
     ------------------------------------------------ */
  var stats = document.querySelectorAll('.stat-numero[data-count]');
  if (stats.length) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var el = entry.target;
          var target = parseInt(el.dataset.count, 10);
          var start = 0;
          var dur = 1800;
          var t0 = performance.now();
          (function step(now) {
            var p = Math.min((now - t0) / dur, 1);
            var eased = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(start + (target - start) * eased);
            if (p < 1) requestAnimationFrame(step);
          })(t0);
          observer.unobserve(el);
        }
      });
    }, { threshold: 0.5 });
    stats.forEach(function(s) { observer.observe(s); });
  }

  /* ------------------------------------------------
     10. READING PROGRESS BAR
     ------------------------------------------------ */
  var progressBar = document.getElementById('reading-progress');
  if (progressBar) {
    window.addEventListener('scroll', function() {
      var scrolled = window.scrollY;
      var total = document.body.scrollHeight - window.innerHeight;
      progressBar.style.transform = total > 0 ? 'scaleX(' + (scrolled / total) + ')' : 'scaleX(0)';
    }, { passive: true });
  }

  /* ------------------------------------------------
     9. FIRE PARTICLES — canvas hero (optimizado)
     ------------------------------------------------ */
  var canvas = document.getElementById('particulas-canvas');
  if (canvas) {
    var ctx = canvas.getContext('2d');
    var W, H, parts = [];
    var lastT = 0, FPI = 1000 / 28;

    function resize() {
      W = canvas.width  = canvas.offsetWidth  || window.innerWidth;
      H = canvas.height = canvas.offsetHeight || window.innerHeight;
    }
    resize();
    window.addEventListener('load',   resize, { passive: true });
    window.addEventListener('resize', resize, { passive: true });

    var SC = ['#ff4400','#ff6600','#dd2200','#e84a00','#ff8800'];
    var MC = [[160,55,10],[130,38,6],[190,70,15],[100,30,5],[210,85,20]];

    function mkSpark() {
      return { t:'s', x:Math.random()*W, y:H+10,
        vx:(Math.random()-.5)*.9, vy:-Math.random()*1.4-.5,
        r:Math.random()*1.6+.7, alpha:1,
        decay:Math.random()*.004+.002,
        ws:Math.random()*.03+.008, wa:Math.random()*Math.PI*2,
        color:SC[Math.floor(Math.random()*SC.length)] };
    }
    function mkSmoke() {
      var c = MC[Math.floor(Math.random()*MC.length)];
      return { t:'m', x:Math.random()*W, y:H+40,
        vx:(Math.random()-.5)*.3, vy:-Math.random()*.4-.18,
        r:Math.random()*60+50, growth:.22,
        alpha:Math.random()*.1+.08, decay:.00025,
        ws:Math.random()*.012+.003, wa:Math.random()*Math.PI*2,
        rgb:c };
    }
    function mkEmber() {
      return { t:'e', x:Math.random()*W, y:H + Math.random()*60,
        vx:(Math.random()-.5)*.12, vy:-Math.random()*.18-.06,
        r:Math.random()*120+90, growth:.08,
        alpha:Math.random()*.07+.05, decay:.00010,
        ws:Math.random()*.006+.002, wa:Math.random()*Math.PI*2,
        rgb:[255,90,15] };
    }

    function draw(now) {
      requestAnimationFrame(draw);
      if (now - lastT < FPI) return;
      lastT = now;

      ctx.clearRect(0, 0, W, H);

      if (parts.length < 80) {
        if (Math.random() < .18) parts.push(mkEmber());
        if (Math.random() < .22) parts.push(mkSmoke());
        if (Math.random() < .45) parts.push(mkSpark());
        if (Math.random() < .25) parts.push(mkSpark());
      }

      for (var i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];
        p.wa += p.ws;

        if (p.t === 's') {
          p.vx += Math.sin(p.wa) * .07;
          p.x += p.vx; p.y += p.vy; p.vx *= .98; p.alpha -= p.decay;
          if (p.alpha > 0) {
            var fa = p.alpha * (.65 + Math.sin(p.wa*3)*.25);
            ctx.globalAlpha = Math.max(0, fa);
            ctx.shadowBlur = 10; ctx.shadowColor = p.color;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0; ctx.globalAlpha = 1;
          }
        } else {
          p.vx += Math.sin(p.wa) * .03;
          p.x += p.vx; p.y += p.vy; p.r += p.growth; p.vx *= .99; p.alpha -= p.decay;
          if (p.alpha > 0) {
            var rgb = p.rgb;
            var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
            g.addColorStop(0,  'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(p.alpha*.95)+')');
            g.addColorStop(.4, 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(p.alpha*.35)+')');
            g.addColorStop(1,  'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
          }
        }
        if (p.alpha <= 0 || p.y < -(p.r||0)*2) parts.splice(i, 1);
      }
    }
    requestAnimationFrame(draw);
  }

})();
</script>
